# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: paper

jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

#      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          upgrade: 'TRUE'
          packages:
            any::remotes
            any::broom
            any::broom.helpers
            any::elo
            any::gt
            any::here
            any::janitor
            any::katex
            any::latex2exp
            any::lmtest
            any::modelsummary
            any::sandwich
            any::tidycensus
            any::tidyverse
            any::VGAM
          include-quarto: false

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # 1. For Pull Requests: Just test-render the project to catch compilation/LaTeX errors
      - name: Test Render Quarto Project (PR only)
        if: github.event_name == 'pull_request'
        uses: quarto-dev/quarto-actions/render@v2

      # 2. For Pushes to Main/Master: Render AND push live to gh-pages branch
      - name: Render and Publish Quarto Project (Main only)
        if: github.event_name == 'push'
        uses: quarto-dev/quarto-actions/publish@v2        
        with:
          target: gh-pages
#          to: pdf
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

